spring.application.name=greengram-delivery

# ===============================
# META / WHATSAPP CLOUD API
# ===============================
whatsapp.verify.token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.api.url=${WHATSAPP_API_URL}
whatsapp.api.token=${WHATSAPP_API_TOKEN}
whatsapp.catalog.id=${WHATSAPP_CATALOG_ID}

# Meta App Secret — used for X-Hub-Signature-256 webhook verification
whatsapp.app.secret=${WHATSAPP_APP_SECRET}

# Set to false ONLY if WHATSAPP_APP_SECRET is unavailable at initial rollout.
# Must be restored to true once the secret is confirmed in the environment.
whatsapp.signature.verification.enabled=${WHATSAPP_SIGNATURE_VERIFICATION_ENABLED:true}

# ===============================
# INTERNAL ROUTING
# ===============================
warehouse.phone.number=${WAREHOUSE_PHONE_NUMBER}
fallback.manager.phone=${FALLBACK_MANAGER_PHONE}
# Comma-separated, no spaces: 91XXXXXXXXXX,91XXXXXXXXXX
authorized.rider.numbers=${AUTHORIZED_RIDER_NUMBERS}

# ===============================
# STORE LOCATION (safe to commit — operational config)
# ===============================
store.latitude=${STORE_LATITUDE:0.0}
store.longitude=${STORE_LONGITUDE:0.0}
store.max.radius.km=${STORE_MAX_RADIUS:10.0}

# ===============================
# DATABASE CONFIGURATION (POSTGRESQL)
# ===============================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# HIBERNATE CONFIGURATION
# ===============================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:validate}
# show-sql disabled for production — prevents verbose stdout logs and data leakage in log aggregators
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=300000

# ===============================
# ADMIN REST API
# ===============================
# Generate a strong key: openssl rand -hex 32
# Retained for server-to-server backwards compatibility, but not used by React UI.
admin.api.key=${ADMIN_API_KEY}

# JWT Authentication for Admin Dashboard
admin.username=${ADMIN_USERNAME}
admin.password.hash=${ADMIN_PASSWORD_HASH}

jwt.secret=${JWT_SECRET}
# Default to 4 hours (14400000 ms)
jwt.expiration.ms=${JWT_EXPIRATION_MS:14400000}

# ===============================
# CORS — Admin React Dashboard
# ===============================
# Defaults to localhost:5173 for local development.
# Set ADMIN_CORS_ALLOWED_ORIGINS env var for additional/production origins (comma-separated).
admin.cors.allowed.origins=${ADMIN_CORS_ALLOWED_ORIGINS:http://localhost:5173}
